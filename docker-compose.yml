services:
  backend:
    image: ghcr.io/${GITHUB_USER}/meal-planner-backend:latest
    container_name: meal-planner-backend
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/meals.db:/app/meals.db
    restart: unless-stopped

  frontend:
    image: ghcr.io/${GITHUB_USER}/meal-planner-frontend:latest
    container_name: meal-planner-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
