name: Publish to GHCR

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag (e.g. v1.0.0)'
        required: true

permissions:
  packages: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase actor
        run: echo "LOWERCASE_ACTOR=${GITHUB_ACTOR,,}" >> $GITHUB_ENV

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ env.LOWERCASE_ACTOR }}/meal-planner-backend:${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
            ghcr.io/${{ env.LOWERCASE_ACTOR }}/meal-planner-backend:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ env.LOWERCASE_ACTOR }}/meal-planner-frontend:${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
            ghcr.io/${{ env.LOWERCASE_ACTOR }}/meal-planner-frontend:latest
